<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Tiny Links{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('index') }}"><span>›</span> Tiny Links</a>
  {% if session.get('logged_in') %}<a class="logout" href="{{ url_for('logout') }}">Log out</a>{% endif %}
</header>
{% with messages = get_flashed_messages() %}
  {% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}
{% endwith %}
{% block body %}{% endblock %}
</body>
</html>
